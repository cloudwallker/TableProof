[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tableproof"
version = "0.1.0"
description = "Local cell-level fidelity checks for Excel-to-Markdown conversions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "markdown-it-py>=3,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "ruff>=0.8,<1"]
convert = ["markitdown[xlsx]>=0.1.3,<0.2"]

[project.scripts]
tableproof = "tableproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tableproof = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
